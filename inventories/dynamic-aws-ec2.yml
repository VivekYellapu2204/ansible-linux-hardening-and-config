---
plugin: amazon.aws.aws_ec2
regions:
  - us-east-1

filters:
  instance-state-name:
    - running

hostnames:
  - tag:Name
  - private-ip-address

keyed_groups:
  # Group hosts by environment tag (e.g., env_production, env_staging)
  - prefix: env
    key: tags.Environment
  # Group hosts by application role tag (e.g., role_application, role_database)
  - prefix: role
    key: tags.Role

compose:
  ansible_host: private_ip_address
