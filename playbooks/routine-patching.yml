---
- name: Controlled Operating System Patch Management and Reboot
  hosts: all
  become: true
  serial: "20%"

  tasks:
    - name: Upgrade all system packages via package manager
      ansible.builtin.dnf:
        name: "*"
        state: latest
        update_cache: true
      register: upgrade_result

    - name: Check if kernel update requires reboot
      ansible.builtin.command: needs-restarting -r
      register: reboot_required
      changed_when: false
      failed_when: false

    - name: Execute controlled system reboot
      ansible.builtin.reboot:
        msg: "Automated patching cycle initiated system reboot."
        connect_timeout: 10
        reboot_timeout: 600
        pre_reboot_delay: 5
        post_reboot_delay: 30
      when: reboot_required.rc == 1
